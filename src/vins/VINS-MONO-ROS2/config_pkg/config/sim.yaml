%YAML:1.0

# ============================================================================
# VINS-Mono — конфиг для СИМУЛЯЦИИ (Gazebo Harmonic + ArduPilot SITL).
#
# Отличия от боевого dummy_13_7.yaml:
#   - Дисторсия НУЛЕВАЯ: Gazebo-камера — идеальный pinhole, линзовых искажений нет.
#   - Интринсики посчитаны из model.sdf: horizontal_fov=1.5708 (90°), 1280x720.
#       fx = fy = (width/2)/tan(fov/2) = 640/tan(45°) = 640
#       cx = width/2 = 640,  cy = height/2 = 360
#   - Пути: контейнер nav использует /root/sim_ws/ (а не /root/vins_ws/).
#   - Экстринсики камера<->IMU взяты из позы камеры в model.sdf.
#   - Шум IMU: в симуляции нет вибраций рамы, значения занижены относительно боевых.
#
# ВАЖНО: разрешение здесь (1280x720) должно совпадать с разрешением камеры в
# Gazebo (model.sdf) И с width_/height_ в camera_node. См. docker/sim/README.md.
# ============================================================================

# Основные пути и топики
# IMU: gz-IMU @250Гц (обход MAVLink-тракта, который капается до ~21Гц в sim;
# боевой Orin берёт IMU с FCU ~200Гц). /gz_imu/data_flu = gz-IMU, сконвертированный
# из FRD во FLU (imu_frd_to_flu.py, nav_up.sh) → drop-in замена /mavros/imu/data_raw
# в том же фрейме. Откат на MAVLink-IMU: imu_topic: "/mavros/imu/data_raw". См. todo3.
imu_topic: "/gz_imu/data_flu"
image_topic: "/image_mono"
output_path: "/root/sim_ws/output/"
vins_folder: "/root/sim_ws/src/vins/VINS-MONO-ROS2/config_pkg/"

# Камера
model_type: "PINHOLE"
camera_name: "camera"
image_width: 1280
image_height: 720
num_of_cam: 1

# Gazebo-камера — идеальный pinhole, дисторсии нет.
distortion_parameters:
   k1: 0.0
   k2: 0.0
   p1: 0.0
   p2: 0.0

# Из horizontal_fov=1.5708 (90°) при 1280x720.
projection_parameters:
   fx: 640.0
   fy: 640.0
   cx: 640.0
   cy: 360.0


# Временная задержка камера<->IMU.
# В симуляции оба источника штампуются sim-clock'ом → td=0, оценку отключаем.
estimate_td: 1          # ВКЛ онлайн-калибровку сдвига камера↔IMU. После перехода на
                        # gz-IMU (штамп = истинное время физики, без задержки) vs камера
                        # (штамп в camera_node в конце пайплайна, с задержкой) появился
                        # td≠0; при estimate_td=0 трекинг расходился за ~10с → failure.
td: 0.0                 # стартовое значение; VINS оценит фактическое.

# Экстринсики (смещение IMU <-> Камера).
# estimate_extrinsic: 0 — фиксированный (не оцениваем онлайн).
# В этом форке VINS: 0=fix, 1=optimize around initial guess, 2=no prior/calibrate.
#
# Конвенция VINS-Mono (как в euroc_config): extrinsicRotation = imu^R_cam —
# поворот ИЗ camera-optical frame (X вправо в кадре, Y вниз, Z вперёд в сцену)
# В тело (FLU: X вперёд, Y влево, Z вверх). СТОЛБЦЫ матрицы — оси камеры,
# выраженные в теле. Камера в Gazebo смотрит вдоль +X camera_link
# (Classic-конвенция), наклон pitch=0.26 рад вниз:
#
#   X_cam (вправо) = -Y_body                            = [0, -1, 0]
#   Y_cam (вниз)   = [-sin(0.26), 0, -cos(0.26)]        = [-0.257, 0, -0.966]
#   Z_cam (вперёд) = [cos(0.26), 0, -sin(0.26)]         = [0.966, 0, -0.257]
#
# Проверка: R^T * g_body = g в камере = [0, 9.48, 2.52] — гравитация смотрит
# в +Y_cam (вниз в кадре) и чуть +Z_cam (вперёд, т.к. наклон 15°). ✓
# ⚠️ До 2026-08-19 здесь лежала ТРАНСПОНИРОВАННАЯ матрица (тело→камера, как и
# гласил старый комментарий) — при estimate_extrinsic: 0 VINS верил ей слепо,
# IMU и зрение систематически спорили → «big (z) translation» каждые 5-13 с.
estimate_extrinsic: 0
ex_calib_result_path: "/root/sim_ws/output/extrinsic.yaml"

extrinsicRotation: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [0, -0.25708, 0.96639,
          -1, 0, 0,
          0, -0.96639, -0.25708]

# Из позы камеры в model.sdf: pose="0.15 0 0.05 ..." => [X, Y, Z] в теле FLU.
extrinsicTranslation: !!opencv-matrix
   rows: 3
   cols: 1
   dt: d
   data: [0.15, 0.0, 0.05]

# Настройки оптимизатора (ceres). ⚠️ КРИТИЧНО: до 2026-08-19 этих ключей не
# было ВООБЩЕ → OpenCV FileStorage возвращал 0 → ceres получал лимит 0 итераций
# → солвер-пустышка: estimator был чистым IMU-счислением, td/ric/шумы ни на что
# не влияли, масштаб свободно дрейфовал → «big (z) translation» каждые 5-13 с.
# Значения — дефолты VINS-Mono (euroc_config.yaml).
max_solver_time: 0.04    # с, бюджет одного солва
max_num_iterations: 8
keyframe_parallax: 10.0  # пикс (при виртуальном фокусе 460) — порог кейфрейма

# Настройки трекера фич
max_cnt: 150
min_dist: 30
freq: 10
F_threshold: 1.0
show_track: 1
equalize: 1
fisheye: 0
flow_back: 1

# Параметры шума IMU.
# Подняты под СЫРОЙ gz-IMU (/gz_imu/data_flu, 250Гц, без фильтра SITL): измеренный
# шум в воздухе gz accel std ~0.3 м/с², gyro std ~0.05-0.2 рад/с (vs отфильтрованный
# MAVROS ~0.04). На прежних acc_n=0.08/gyr_n=0.004 (под MAVROS) VINS недооценивал
# шум → failure detection/reboot после init. Поднимаем acc_n ×2.5, gyr_n ×5.
# Откат под MAVROS-IMU: acc_n 0.08, gyr_n 0.004.
acc_n: 0.2
gyr_n: 0.02
acc_w: 0.0004
gyr_w: 2.0e-5
g_norm: 9.81
