# Мишень Kalibr — AprilGrid 7×7 на листе ПВХ 1000×1000 мм (src/vins/calib/aprilgrid_pvc1000.pdf).
# ОСНОВНАЯ мишень (камера–IMU и интринсики). Заказ 2026-09-16: UV-печать на белом ПВХ 5 мм,
# матовая, 1:1. Сгенерирована kalibr_create_target_pdf из образа kalibr:1f60227:
#
#   kalibr_create_target_pdf --type apriltag --nx 7 --ny 7 --tsize 0.1 --tspace 0.3
#
# Сетка 959.5×959.5 мм по центру листа 1000×1000, поля 20 мм.
# ⚠️ tagSize — ПОСЛЕ ПЕЧАТИ ИЗМЕРИТЬ: сторона чёрного квадрата тега, номинал 100.0 мм;
# промежуток между тегами номинал 30.0 мм. Точнее — рулеткой по всей ширине сетки:
# 7 тегов + 6 промежутков = 880 мм номинал → tagSize = измеренное / 8.8.
# tagSpacing — отношение, не меняется.
target_type: 'aprilgrid'
tagCols: 7
tagRows: 7
tagSize: 0.100        # [м] сторона тега — заменить измеренным
tagSpacing: 0.3       # промежуток / сторона тега (безразмерный)
