# Мишень Kalibr — AprilGrid 6×8 на листе A1 (src/vins/calib/aprilgrid_a1.pdf).
# ОСНОВНАЯ мишень (камера–IMU и интринсики); A4-вариант рядом — для настольных проб.
# Сгенерирована kalibr_create_target_pdf из образа kalibr:1f60227 (коммит 1f60227):
#
#   kalibr_create_target_pdf --type apriltag --nx 6 --ny 8 --tsize 0.068 --tspace 0.3
#
# Сетка 564×741 мм, положена по центру A1 (594×841), поля 15 / 50 мм.
# ⚠️ tagSize — ПОСЛЕ ПЕЧАТИ ИЗМЕРИТЬ (плоттер может масштабировать): сторона
# чёрного квадрата тега, номинал 68.0 мм; промежуток между тегами номинал 20.4 мм.
# Мерить рулеткой ПО ВСЕЙ ширине сетки — точнее: 6 тегов + 5 промежутков = 510 мм
# номинал → tagSize = измеренное / 7.5. tagSpacing — отношение, не меняется.
target_type: 'aprilgrid'
tagCols: 6
tagRows: 8
tagSize: 0.068        # [м] сторона тега — заменить измеренным
tagSpacing: 0.3       # промежуток / сторона тега (безразмерный)
