%YAML:1.0

# Основные пути и топики
imu_topic: "/mavros/imu/data_raw"
image_topic: "/image_mono"
output_path: "/root/vins_ws/output/"
vins_folder: "/root/vins_ws/src/VINS-MONO-ROS2/config_pkg/"

# Камера
model_type: "PINHOLE"
camera_name: "camera"
image_width: 1280
image_height: 720
num_of_cam: 1

# ИЗМЕРЕНО Kalibr 2026-10-03 (pinhole-radtan, мишень ПВХ 7×7, 2 bag'а «в руках», 601 кадр,
# репроекция 0.18/0.15 px; tools/vins/calib/README.md). Поле зрения 1280×720 ≈ 59° по горизонтали.
# Сим берёт отсюда же фокус (идеальная камера: fx, центр посередине, без дисторсии — CAM_IDEAL).
# До калибровки — заглушка сима fx=fy=640, cx=640, cy=360 (90°), дисторсия 0.
distortion_parameters:
   k1: 0.04214
   k2: -0.08968
   p1: -0.000235
   p2: 0.000088

projection_parameters:
   fx: 1124.71
   fy: 1124.54
   cx: 630.80
   cy: 356.42


# Онлайн-оценка задержки времени между камерой и IMU
estimate_td: 1      # 1 - включить автоматическую подстройку, 0 - выключить
td: 0.0             # Начальное предположение о задержке (в секундах)

# Экстринсики (смещение IMU <-> Камера)
estimate_extrinsic: 1
ex_calib_result_path: "/home/andriy/vins_ws/extrinsic.yaml"

# Конвенция VINS: imu^R_cam, СТОЛБЦЫ — оси камеры (X вправо, Y вниз, Z вперёд)
# в теле FLU (/mavros/imu/data_raw). Камера горизонтально вперёд, без наклона:
# X_cam=-Y_body, Y_cam=-Z_body, Z_cam=+X_body (как sim.yaml с 2026-10-01).
# ⚠️ До 2026-10-01 тут стояла ЕДИНИЧНАЯ матрица = камера смотрит ВВЕРХ
# (Z_cam=+Z_body): estimate_extrinsic 1 уточнял её от начальной ошибки в 90°.
# Заготовка до калибровки Kalibr (tools/vins/calib/README.md).
extrinsicRotation: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [0, 0, 1,
          -1, 0, 0,
          0, -1, 0]

# В метрах
# Допустим, камера закреплена на 
# 12 см впереди полетника, смещена на 
# 2 см вправо и находится на 
# 4 см ниже его центра.
# data: [0.12, -0.02, -0.04] # [X, Y, Z] в метрах

extrinsicTranslation: !!opencv-matrix
   rows: 3
   cols: 1
   dt: d
   data: [0.14, 0.0, -0.06]

# Настройки трекера фич
max_cnt: 150
min_dist: 30
freq: 15
F_threshold: 1.0
show_track: 1
equalize: 1
fisheye: 0
flow_back: 1

# Параметры шума IMU
acc_n: 0.08        # Увеличен в 10 (0.8) раза для компенсации вибраций рамы
gyr_n: 0.004       # Увеличен в 10 (0.04) раза
acc_w: 0.00004    # Оставляем (зависит от чипа)
gyr_w: 2.0e-6     # Оставляем (зависит от чипа)
g_norm: 9.81