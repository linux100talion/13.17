# Драйвер svpcom/rtl8812au (модуль 88XXau_wfb) — Alfa AWUS036ACH под WFB-ng, монитор+инжекция.
# Мощность у этого драйвера — ИНДЕКС 1..63, не dBm; какой индекс = сколько dBm, зависит от
# калибровки карты. За Alfa стоит бустер EDUP EP-AB025: предел на ВХОДЕ 20 dBm, уставка ~15
# (doc/HW/alfa.md §5). Поэтому драйвер стартует на заведомо малом индексе, рабочий выбирается
# калибровкой по излому насыщения бустера (ноут в мониторе меряет RSSI) — НЕ поднимать вслепую.
# Файл положен ДО установки драйвера (2026-09-24) со стартовым 10. Калибровка 2026-09-24
# (doc/HW/alfa.md §5): бустер включается у ~14, линейно ~0.6 dB/индекс до насыщения у ~34–36.
# Рабочий 28: ~12–14 dBm на входе бустера, 5 dB ниже насыщения. Выше 30 не ставить.
options 88XXau_wfb rtw_tx_pwr_idx_override=28
