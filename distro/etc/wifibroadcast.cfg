# WFB-ng — БОРТ (wifibroadcast@drone). Полный набор ключей: /usr/lib/python3/dist-packages/
# wfb_ng/conf/master.cfg (этот файл его дополняет). Пара — tools/wfb/gs.cfg на ноуте:
# канал, link_domain, ldpc/stbc должны совпадать.
[common]
wifi_channel = 161     # 5805 МГц (5795–5815) — середина полосы бустера EDUP 5725–5850
wifi_region = 'BO'     # регион CRDA: снимает «no IR» с каналов 149–165 (иначе передача запрещена)
wifi_txpower = None    # НЕ ТРОГАТЬ: мощность держит модуль, rtw_tx_pwr_idx_override в
                       # /etc/modprobe.d/88XXau_wfb.conf (бустер: предел 20 dBm на входе)

[base]
ldpc = 0               # наземный Alfa на ноуте — штатный rtw88: LDPC/STBC на приёме не гарантированы;
stbc = 0               # поднимать после проверки линка (оба конца)

[drone_mavlink]
peer = 'listen://127.0.0.1:14560'   # mavlink-router шлёт сюда (UdpEndpoint wfb)
