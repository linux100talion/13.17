# Ядро 5 — под видеостример (H.264 на CPU: у Orin Nano нет NVENC). По умолчанию ВСЁ, что
# запускает systemd (службы, docker/containerd → контейнер, ssh-сессии), живёт на ядрах 0–4;
# стример vins_nodes.sh сажает на 5 явно (taskset). Это не isolcpus: ядро 5 не запрещено
# ядру ОС и тому, кто попросит его сам, — но по умолчанию туда никто не попадает.
# Применяется при загрузке (или systemctl daemon-reexec + перезапуск служб). 2026-10-02.
[Manager]
CPUAffinity=0-4
