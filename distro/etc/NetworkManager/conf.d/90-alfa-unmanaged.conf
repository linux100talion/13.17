# Бортовой Alfa (00:c0:ca:b9:55:0c) — под WFB-ng (монитор+инжекция), NetworkManager его не трогает:
# ни подключений, ни СКАНОВ (скан = передача probe request на мощности драйвера по умолчанию,
# а за Alfa бустер с пределом 20 dBm на входе). Профиль TP-Link_6611_alfa оставлен выключенным
# (autoconnect=false) для отката. Встроенный wlP1p1s0 управляется как раньше.
[keyfile]
unmanaged-devices=mac:00:c0:ca:b9:55:0c
