# WFB-ng — НАЗЕМНАЯ СТАНЦИЯ, ноут (wifibroadcast@gs). Полный набор ключей: /usr/lib/python3/dist-packages/
# wfb_ng/conf/master.cfg (этот файл его дополняет). Пара — distro/etc/wifibroadcast.cfg на борту:
# канал, link_domain, ldpc/stbc должны совпадать.
[common]
wifi_channel = 161     # 5805 МГц (5795–5815) — середина полосы бустера EDUP 5725–5850
wifi_region = 'BO'     # регион CRDA: снимает «no IR» с каналов 149–165 (иначе передача запрещена)
wifi_txpower = None    # мощность драйвера по умолчанию: наземный Alfa без бустера, штатный rtw88

[base]
ldpc = 0               # наземный Alfa на ноуте — штатный rtw88: LDPC/STBC на приёме не гарантированы;
stbc = 0               # поднимать после проверки линка (оба конца)

[gs_mavlink]
peer = 'connect://127.0.0.1:14551'  # телеметрия борта → Mission Planner в Win11 (UDP 14551; 14550 занят SITL симуляции)
