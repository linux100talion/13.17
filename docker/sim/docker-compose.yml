version: '3.8'

# ============================================================================
# Симуляционный стек: ArduPilot SITL + Gazebo Harmonic + VINS/Nav
# Запускается на x86 ноутбуке с NVIDIA GPU.
# Реальное железо (камера, полётник) НЕ требуется — всё эмулируется.
#
# Перед запуском на хосте:
#   xhost +local:root        # разрешить контейнеру доступ к X11
#   export DISPLAY=:0
# ============================================================================

services:

  # 1. СИМУЛЯТОР: Gazebo Harmonic (рендер мира + физика) + ArduPilot SITL (полётник)
  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: p1317_simulator
    restart: unless-stopped

    # host-сеть: SITL отдаёт MAVLink на TCP 127.0.0.1:5760,
    # Gazebo<->ROS мост работает по DDS без NAT.
    network_mode: host
    ipc: host

    # GPU нужен Gazebo для аппаратного рендера через EGL (headless) или X11 (GUI).
    # Headless (bag-коллекция): DISPLAY не нужен, gz sim --headless-rendering.
    # GUI (локальный ноут): раскомментировать DISPLAY + volume /tmp/.X11-unix
    #   и выполнить на хосте: xhost +local:root
    runtime: nvidia
    environment:
      # GUI-режим (окно Gazebo на ноуте): сервер остаётся headless (EGL),
      # окно — отдельный клиент `make gui` (gz sim -g). Нужен xhost из host-setup.
      - DISPLAY=${DISPLAY:-:1}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all      # graphics+compute: нужно для EGL/рендера
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      # Разрешение камеры — из env хоста (default 1280×720, боевой ArduCam).
      # Применяется при СОЗДАНИИ контейнера → менять только через up/fresh-start.
      - CAMERA_W=${CAMERA_W:-1280}
      - CAMERA_H=${CAMERA_H:-720}
      # ВЕТЕР (Gazebo WindEffects; 0 = выкл). Применяется при СОЗДАНИИ контейнера,
      # как и разрешение камеры → менять только через fresh-start. См. scripts/sim_up.sh.
      - WIND_SPD=${WIND_SPD:-0}
      - WIND_DIR_DEG=${WIND_DIR_DEG:-98}
      - WIND_FACTOR=${WIND_FACTOR:-0.4}
      # ПОРЫВЫ ветра: спека для src/lab/wind_gust.py (его запускает capture_scene
      # на прогоне); сюда доезжает ради sim_up.sh — при WIND_SPD=0 с непустым
      # WIND_GUST плагин WindEffects всё равно грузится (порывы на штиле).
      - WIND_GUST=${WIND_GUST:-}
      # ТОЧКА СПАВНА дрона: "x y z roll pitch yaw" в осях МИРА Gazebo (пусто =
      # штатный центр площадки). Задаётся из окружения прогона (freefly_lv:
      # SPAWN_FROM=<каталог прогона> → src/lab/spawn_pose.py) или постоянно —
      # строкой SPAWN_POSE=... в docker/sim/.env. Применяется при СОЗДАНИИ
      # контейнера → менять только через fresh-start. См. scripts/sim_up.sh.
      - SPAWN_POSE=${SPAWN_POSE:-}
      # МИР (пусто = /root/worlds/mili_fortress.sdf). Вариант с МЕЛКОЙ фактурой
      # земли для полётов у земли (базовая земля бесфактурна ближе ~3 м — одна
      # текстура 512px на 150 м, зрение слепнет по построению мира):
      #   WORLD=/root/worlds/mili_fortress_fine.sdf
      # Применяется при СОЗДАНИИ контейнера → только fresh-start.
      - WORLD=${WORLD:-}

    # iGPU (Intel, DRI3) для ОКНА `make gui`: X-сервер гибридного ноута сидит на
    # /dev/dri/card*, без проброса Mesa в контейнере падает на llvmpipe (софт-рендер,
    # дёрганая картинка, ~150% CPU). Сервер Gazebo это не касается — он рендерит
    # камеру через EGL на NVIDIA. Применяется при СОЗДАНИИ контейнера (fresh-start).
    devices:
      - /dev/dri:/dev/dri

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw    # X11 для окна Gazebo (make gui)
      - ./worlds:/root/worlds:rw            # SDF-миры и модели дрона
      - ./output:/root/output:rw
      - ./scripts:/scripts:ro               # sim_up.sh запускается автоматически
      - ./config/sitl-extra.parm:/root/sitl-extra.parm:ro  # доп. параметры SITL
      - sitl_eeprom:/root/sitl_state        # eeprom.bin SITL (калибровка акселя) — выживает при fresh-start

    # sim_up.sh стартует Gazebo+SITL+bridge в фоне, потом tail держит контейнер.
    # Итерация без пересоздания: docker compose stop && docker compose start
    command: bash -c "bash /scripts/sim_up.sh; exec tail -f /dev/null"

  # 2. РОУТЕР MAVLINK: разводит телеметрию SITL между MAVROS, QGC и кастомными нодами.
  mavlink_router:
    build:
      context: ./mavlink_router
      dockerfile: Dockerfile
    container_name: p1317_mavlink_router
    restart: unless-stopped
    network_mode: host
    depends_on:
      - simulator
    volumes:
      - ./config/mavlink-router.conf:/etc/mavlink-router/main.conf:ro

  # 3. МОЗГ: VINS-Mono + нейросети навигации (CUDA). Камеру берёт из Gazebo-топика.
  nav:
    build:
      context: ../..                        # корень репо: нужен доступ к src/
      dockerfile: docker/sim/nav/Dockerfile
      args:
        # Архитектуры CUDA для сборки OpenCV. Дефолт покрывает RTX 20/30/40, но
        # собирает вчетверо дольше нужного: под конкретную карту задать ОДНУ через
        # docker/sim/.env (Ada — RTX 40xx — это 8.9).
        CUDA_ARCH_BIN: "${CUDA_ARCH_BIN:-7.5;8.0;8.6;8.9}"
    container_name: p1317_nav
    restart: unless-stopped
    network_mode: host
    ipc: host

    # GPU для нейросетей И для CUDA-дебайеризации камеры-ноды (cv::cuda).
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      # Разрешение камеры — из env хоста (default 1280×720). ДОЛЖНО совпадать с
      # simulator. Применяется при СОЗДАНИИ контейнера → менять через up/fresh-start.
      - CAMERA_W=${CAMERA_W:-1280}
      - CAMERA_H=${CAMERA_H:-720}

    # Виртуальная камера: байеризатор пишет сюда, camera_node читает отсюда.
    # /dev/rawbayer создаётся на ХОСТЕ модулем v4l2loopback (см. README).
    devices:
      - /dev/rawbayer:/dev/rawbayer

    # Живой пульт (TX12 в режиме USB-джойстика) → joy_linux_node → /joy → JoyPilot.
    # /dev/input монтируется КАТАЛОГОМ (volume ниже), а не через devices:, чтобы
    # работал hotplug — пульт можно втыкать ПОСЛЕ старта контейнера. Доступ к
    # char-устройствам input (major 13) даёт это cgroup-правило.
    device_cgroup_rules:
      - 'c 13:* rmw'

    # Монтируем исходники. build/ и install/ собираются внутри через colcon.
    # camera_pkg ТЕПЕРЬ монтируем — в симуляции нода работает "как есть",
    # читая Bayer-кадры из /dev/rawbayer вместо реального /dev/video0.
    depends_on:
      - simulator

    volumes:
      - ../../src/vins:/root/sim_ws/src/vins
      # Форк linux100talion/VINS-MONO-ROS2, ветка 1317_debug — живёт ВНЕ репы.
      # Путь переопределяется VINS_SRC (docker/sim/.env), дефолт — раскладка GCE-бокса.
      - ${VINS_SRC:-/root/VINS-MONO-ROS2}:/root/sim_ws/src/vins_oss
      - ../../src/sim:/root/sim_ws/src/sim       # симуляционная обвязка
      - ../../src/nav:/root/sim_ws/src/nav       # нейросети навигации (пока пусто)
      - ../../src/control:/root/sim_ws/src/control    # ядро управления control_pkg (рефактор, ветка nn2_c3_control)
      - ../../src/mission:/root/sim_ws/src/mission    # миссии mission_pkg — потребитель control_pkg
      - ../../src/lab:/lab:ro                    # управляющие скрипты (arm/takeoff/hover/land/disarm/fly/vins_watch)
      - ../../src/camera:/root/sim_ws/src/camera
      - /dev/input:/dev/input                    # джойстик (hotplug; доступ — device_cgroup_rules выше)
      - nav_colcon_build:/root/sim_ws/build      # colcon build — выживает при fresh-start
      - nav_colcon_install:/root/sim_ws/install  # colcon install — выживает при fresh-start
      - ./output:/root/sim_ws/output
      - ./scripts:/scripts:ro                    # nav_up.sh запускается автоматически

    # nav_up.sh: colcon build (если нет) + bayerizer + VINS launch + MAVROS.
    # Итерация без пересоздания: docker compose stop && docker compose start
    command: bash -c "bash /scripts/nav_up.sh; exec tail -f /dev/null"

volumes:
  nav_colcon_build:   # colcon build artifacts (build/): выживают при fresh-start, сносятся make clean
  nav_colcon_install: # colcon install artifacts (install/): аналогично
  sitl_eeprom:        # eeprom.bin SITL (одноразовая accel-калибровка + параметры): выживает при fresh-start, сносится make clean
